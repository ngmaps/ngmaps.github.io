<body>


    <!-- =====================================================
         MAP
         ===================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div id="loading">

        Loading Yandex Maps...

    </div>


    <!-- =====================================================
         SEARCH
         ===================================================== -->

    <div id="searchPanel">

        <div id="searchRow">

            <input
                id="searchInput"
                type="search"
                placeholder="Where to?"
                autocomplete="off"
                enterkeyhint="search"
            >

            <button
                id="searchButton"
                type="button"
            >
                SEARCH
            </button>

        </div>


        <div id="results"></div>

    </div>


    <!-- =====================================================
         DESTINATION
         ===================================================== -->

    <div id="destinationPanel">

        <div id="destinationTitle"></div>

        <div id="destinationAddress"></div>

        <button
            id="clearButton"
            type="button"
        >
            CLEAR DESTINATION
        </button>

    </div>


    <!-- =====================================================
         BOTTOM
         ===================================================== -->

    <div id="bottomPanel">

        <div id="status">

            Starting...

        </div>


        <button
            id="locationButton"
            type="button"
        >
            📍
        </button>

    </div>


<script>


/* ============================================================
   CONFIGURATION
   ============================================================ */


/*
   JavaScript API 3.0

   This is your JS API key.
*/

const YANDEX_JS_API_KEY =
    "fc5db2c9-c6bd-49fe-9ab7-71d08afae06a";


/*
   IMPORTANT

   Put your REAL Search API key here.

   Do NOT put the UUID/name of the API product here.
*/

const YANDEX_SEARCH_API_KEY =
    "PASTE_SEARCH_API_KEY_HERE";


/*
   Put your REAL Geosuggest API key here.

   Do NOT put the UUID/name of the API product here.
*/

const YANDEX_SUGGEST_API_KEY =
    "PASTE_GEOSUGGEST_API_KEY_HERE";


/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

let map = null;

let myPosition = null;

let destinationPosition = null;

let destinationMarker = null;


/* ============================================================
   DOM
   ============================================================ */

const loading =
    document.getElementById("loading");

const status =
    document.getElementById("status");

const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const results =
    document.getElementById("results");

const locationButton =
    document.getElementById("locationButton");

const destinationPanel =
    document.getElementById("destinationPanel");

const destinationTitle =
    document.getElementById("destinationTitle");

const destinationAddress =
    document.getElementById("destinationAddress");

const clearButton =
    document.getElementById("clearButton");


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(message) {

    status.innerText = message;

}


/* ============================================================
   INITIALIZE MAP
   ============================================================ */

async function initMap() {

    try {

        setStatus(
            "Loading Yandex Maps..."
        );


        /*
           Wait for JS API 3.0
        */

        await ymaps3.ready;


        /*
           Configure Search / Suggest API keys.

           We only set them when real keys
           have been entered.
        */

        const apiKeys = {};


        if (
            YANDEX_SEARCH_API_KEY &&
            !YANDEX_SEARCH_API_KEY
                .startsWith("PASTE_")
        ) {

            apiKeys.search =
                YANDEX_SEARCH_API_KEY;

        }


        if (
            YANDEX_SUGGEST_API_KEY &&
            !YANDEX_SUGGEST_API_KEY
                .startsWith("PASTE_")
        ) {

            apiKeys.suggest =
                YANDEX_SUGGEST_API_KEY;

        }


        if (
            Object.keys(apiKeys).length > 0
        ) {

            ymaps3
                .getDefaultConfig()
                .setApikeys(apiKeys);

        }


        /*
           Get map classes.
        */

        const {
            YMap,
            YMapDefaultSchemeLayer,
            YMapDefaultFeaturesLayer
        } = ymaps3;


        /*
           Create map.

           Tbilisi is used only as the
           initial position.
        */

        map = new YMap(

            document.getElementById("map"),

            {

                location: {

                    center: [
                        44.8015,
                        41.6938
                    ],

                    zoom: 12

                }

            }

        );


        /*
           Map tiles.
        */

        map.addChild(

            new YMapDefaultSchemeLayer()

        );


        /*
           Features layer.
        */

        map.addChild(

            new YMapDefaultFeaturesLayer({
                zIndex: 1800
            })

        );


        loading.classList.add(
            "hidden"
        );


        setStatus(
            "Yandex Maps ready"
        );


        /*
           Try to get Tesla/browser GPS.
        */

        getMyLocation();


    }

    catch (error) {

        console.error(
            "Yandex initialization error:",
            error
        );


        loading.innerText =
            "Yandex Maps error";


        setStatus(
            "Yandex Maps failed to load"
        );

    }

}


/* ============================================================
   GPS
   ============================================================ */

function getMyLocation() {

    if (
        !navigator.geolocation
    ) {

        setStatus(
            "GPS is not supported"
        );

        return;

    }


    setStatus(
        "Getting GPS location..."
    );


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            myPosition = [

                longitude,
                latitude

            ];


            console.log(
                "GPS:",
                latitude,
                longitude
            );


            /*
               Move map to vehicle.
            */

            map.setLocation({

                center:
                    myPosition,

                zoom: 16,

                duration: 700

            });


            setStatus(
                "My location"
            );

        },


        function(error) {

            console.error(
                "GPS error:",
                error
            );


            if (
                error.code === 1
            ) {

                setStatus(
                    "GPS permission denied"
                );

            }

            else if (
                error.code === 2
            ) {

                setStatus(
                    "GPS position unavailable"
                );

            }

            else if (
                error.code === 3
            ) {

                setStatus(
                    "GPS timeout"
                );

            }

            else {

                setStatus(
                    "GPS error"
                );

            }

        },


        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 5000

        }

    );

}


/* ============================================================
   SEARCH BUTTON
   ============================================================ */

searchButton.addEventListener(

    "click",

    function() {

        performSearch();

    }

);


/* ============================================================
   ENTER KEY
   ============================================================ */

searchInput.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            performSearch();

        }

    }

);


/* ============================================================
   SEARCH
   ============================================================ */

async function performSearch() {

    const query =
        searchInput.value.trim();


    if (!query) {

        setStatus(
            "Enter a destination"
        );

        searchInput.focus();

        return;

    }


    /*
       If Search API key isn't configured,
       tell user exactly what is missing.
    */

    if (
        YANDEX_SEARCH_API_KEY
            .startsWith("PASTE_")
    ) {

        setStatus(
            "Search API key is not configured"
        );

        results.innerHTML = `

            <div class="result">

                <div class="resultTitle">
                    Search API key required
                </div>

                <div class="resultAddress">
                    Add your Search API key
                    to the code.
                </div>

            </div>

        `;

        results.style.display =
            "block";

        return;

    }


    setStatus(
        "Searching..."
    );


    results.style.display =
        "none";


    try {

        const response =
            await ymaps3.search({

                text: query,

                results: 8

            });


        console.log(
            "Search response:",
            response
        );


        /*
           Yandex returns SearchResponse.
        */

        const items =
            response.items || [];


        if (
            items.length === 0
        ) {

            setStatus(
                "Nothing found"
            );

            return;

        }


        showSearchResults(
            items
        );


        setStatus(
            "Select destination"
        );


    }

    catch (error) {

        console.error(
            "Search error:",
            error
        );


        setStatus(
            "Search failed"
        );


        results.innerHTML = `

            <div class="result">

                <div class="resultTitle">
                    Search error
                </div>

                <div class="resultAddress">
                    Check your Search API key
                    and API permissions.
                </div>

            </div>

        `;


        results.style.display =
            "block";

    }

}


/* ============================================================
   DISPLAY SEARCH RESULTS
   ============================================================ */

function showSearchResults(
    items
) {

    results.innerHTML = "";


    items.forEach(

        function(item) {

            const result =
                document.createElement(
                    "div"
                );


            result.className =
                "result";


            /*
               Search result properties
            */

            const properties =
                item.properties || {};


            const title =
                properties.name ||
                item.title ||
                "Unknown";


            const description =
                properties.description ||
                item.description ||
                "";


            const titleElement =
                document.createElement(
                    "div"
                );


            titleElement.className =
                "resultTitle";


            titleElement.innerText =
                title;


            const addressElement =
                document.createElement(
                    "div"
                );


            addressElement.className =
                "resultAddress";


            addressElement.innerText =
                description;


            result.appendChild(
                titleElement
            );


            result.appendChild(
                addressElement
            );


            result.addEventListener(

                "click",

                function() {

                    selectSearchResult(
                        item
                    );

                }

            );


            results.appendChild(
                result
            );

        }

    );


    results.style.display =
        "block";

}


/* ============================================================
   SELECT RESULT
   ============================================================ */

function selectSearchResult(
    item
) {

    results.style.display =
        "none";


    /*
       Geometry contains coordinates.
    */

    if (
        !item.geometry ||
        !item.geometry.coordinates
    ) {

        setStatus(
            "Destination coordinates unavailable"
        );

        return;

    }


    destinationPosition =
        item.geometry.coordinates;


    console.log(
        "Destination:",
        destinationPosition
    );


    /*
       Move map.
    */

    map.setLocation({

        center:
            destinationPosition,

        zoom: 16,

        duration: 700

    });


    /*
       Create destination marker.
    */

    createDestinationMarker();


    /*
       Destination information.
    */

    const properties =
        item.properties || {};


    destinationTitle.innerText =
        properties.name ||
        item.title ||
        "Destination";


    destinationAddress.innerText =
        properties.description ||
        item.description ||
        "";


    destinationPanel.style.display =
        "block";


    setStatus(
        "Destination selected"
    );

}


/* ============================================================
   DESTINATION MARKER
   ============================================================ */

function createDestinationMarker() {

    /*
       Remove old marker.
    */

    if (
        destinationMarker
    ) {

        map.removeChild(
            destinationMarker
        );

        destinationMarker =
            null;

    }


    const {
        YMapMarker
    } = ymaps3;


    /*
       HTML marker.
    */

    const markerElement =
        document.createElement(
            "div"
        );


    markerElement.style.width =
        "34px";


    markerElement.style.height =
        "34px";


    markerElement.style.borderRadius =
        "50%";


    markerElement.style.background =
        "#e53935";


    markerElement.style.border =
        "5px solid white";


    markerElement.style.boxShadow =
        "0 3px 10px rgba(0,0,0,.5)";


    /*
       Create marker.
    */

    destinationMarker =
        new YMapMarker(

            {

                coordinates:
                    destinationPosition,

                draggable:
                    false

            },

            markerElement

        );


    map.addChild(
        destinationMarker
    );

}


/* ============================================================
   CLEAR DESTINATION
   ============================================================ */

clearButton.addEventListener(

    "click",

    function() {

        if (
            destinationMarker
        ) {

            map.removeChild(
                destinationMarker
            );

            destinationMarker =
                null;

        }


        destinationPosition =
            null;


        destinationPanel.style.display =
            "none";


        searchInput.value =
            "";


        results.innerHTML =
            "";


        results.style.display =
            "none";


        setStatus(
            "Ready"
        );

    }

);


/* ============================================================
   LOCATION BUTTON
   ============================================================ */

locationButton.addEventListener(

    "click",

    function() {

        getMyLocation();

    }

);


/* ============================================================
   START APPLICATION
   ============================================================ */

initMap();


</script>

</body>

</html>
