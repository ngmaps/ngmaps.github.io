<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NG Maps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>NG Maps</title>
<style>
:root{--bg:rgba(28,30,34,.82);--bg2:rgba(255,255,255,.08);--fg:#f4f5f7;--mut:#9aa0a8;--acc:#22c3a6;--accfg:#04201b;--line:rgba(255,255,255,.08)}
body.light{--bg:rgba(250,250,251,.88);--bg2:rgba(0,0,0,.06);--fg:#16181c;--mut:#6b7079;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Georgian",sans-serif;font-size:20px;background:#0e0f11;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#map{position:absolute;inset:0}
body.nightmap #map [class*="ground-pane"]{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92)}
.hidden{display:none!important}
.glass{background:var(--bg);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.btn{background:var(--bg2);color:var(--fg);border:none;border-radius:16px;font-size:22px;min-width:56px;height:56px;padding:0 20px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.btn:active{transform:scale(.94)}
.green{background:var(--acc);color:var(--accfg);font-weight:600}
.big{height:64px;font-size:22px;padding:0 22px}
#panel{position:absolute;top:calc(16px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));bottom:calc(40px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 120px));display:flex;flex-direction:column;gap:12px;z-index:10;pointer-events:none}
#panel>*{pointer-events:auto}
#top{display:flex;flex-direction:column;gap:10px;min-height:0}
#searchBox{display:flex;align-items:center;gap:6px;border-radius:22px;padding:6px 6px 6px 20px;flex:none}
#q{flex:1;min-width:0;height:56px;font-size:22px;border:none;background:transparent;color:var(--fg);outline:none;font-family:inherit;-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--mut)}
#qBtn,#qCancel{background:transparent}
#results{border-radius:22px;overflow:auto;padding:6px;min-height:0}
.item{padding:13px 16px;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.item:active{background:var(--bg2)}
.item .mid{flex:1;min-width:0}
.nm{color:var(--fg);font-size:21px;display:flex;justify-content:space-between;gap:12px}
.nm span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad{color:var(--mut);font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{color:var(--acc);font-size:17px;white-space:nowrap}
.del{color:#ef4444;font-size:22px;padding:6px 10px}
.msg,.hdr{padding:12px 16px 6px;color:var(--mut);font-size:15px;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between}
.hdr a{color:var(--acc);text-transform:none;letter-spacing:0;font-size:17px;cursor:pointer}
.star{color:#f5c542}
.chips{display:flex;gap:8px;padding:6px 6px 2px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--bg2);color:var(--fg);font-size:19px;cursor:pointer}
.chip small{display:block;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ic{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--accfg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.chip.off .ic{background:var(--bg2);color:var(--mut)}
#banner{border-radius:22px;display:flex;align-items:center;gap:18px;padding:18px 22px;flex:none}
#bArrow{width:86px;height:86px;border-radius:20px;background:var(--acc);color:var(--accfg);font-size:58px;display:flex;align-items:center;justify-content:center;flex:none}
#bDist{font-size:42px;font-weight:700;color:var(--fg);line-height:1.1}
#bText{font-size:21px;color:var(--mut);margin-top:4px}
#card{margin-top:auto;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
#card.attop{margin-top:0}
#dName{font-size:22px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dStats{color:var(--mut);font-size:19px;margin-top:6px}
#dStats b{color:var(--acc);font-weight:600}
.nextstop{font-size:16px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px}
.nextstop b{color:var(--fg)}
.stops{display:flex;flex-direction:column;gap:6px}
.stop{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;background:var(--bg2);color:var(--fg);font-size:18px}
.stop .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.stop .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .x{color:var(--mut);font-size:20px;padding:4px 8px;cursor:pointer}
.add{color:var(--acc);font-size:18px;padding:6px 12px;cursor:pointer}
.routes{display:flex;flex-direction:column;gap:8px}
.rt{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:16px;background:var(--bg2);border:2px solid transparent;color:var(--fg);cursor:pointer}
.rt.sel{border-color:var(--acc);background:rgba(34,195,166,.12)}
.rt .tm{font-size:25px;font-weight:700;min-width:104px;white-space:nowrap}
.rt .in{flex:1;min-width:0;font-size:16px;color:var(--mut)}
.rt .in div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .in b{color:var(--fg);font-weight:600}
.rt .in .jam{color:#f87171}
.rt .tag{font-size:13px;padding:3px 8px;border-radius:8px;background:var(--acc);color:var(--accfg);font-weight:600;white-space:nowrap}
#steps{border-top:1px solid var(--line);padding-top:6px}
.st{display:flex;align-items:center;gap:14px;padding:9px 4px;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:none}
.st .a{width:40px;height:40px;border-radius:12px;background:var(--bg2);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.st .t{flex:1;color:var(--fg);font-size:18px}
.st .d{color:var(--mut);font-size:16px;white-space:nowrap}
#actions{display:flex;gap:8px;flex:none}
#actions #go{flex:1}
#side{position:absolute;right:calc(16px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;border-radius:24px;padding:6px;gap:4px;z-index:10}
#side .btn{width:62px;height:62px;background:transparent;font-size:26px;padding:0;display:flex;align-items:center;justify-content:center}
#side .btn.on{background:var(--acc);color:var(--accfg)}
#side .lang{font-size:17px;font-weight:700}
#speed{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(44px + env(safe-area-inset-bottom));z-index:10;width:100px;height:100px;border-radius:50%;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;font-weight:700}
#speed small{font-size:14px;font-weight:400;color:var(--mut)}
#toast{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--bg);color:var(--fg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);padding:14px 26px;border-radius:18px;font-size:19px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dlg{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.dbox{width:min(500px,92%);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;color:var(--fg)}
.dbox h3{margin:0;font-size:22px}
.dbox p{margin:0;color:var(--mut);font-size:16px}
.dbox input,.dbox textarea{width:100%;font-size:20px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font-family:inherit;outline:none;-webkit-user-select:text;user-select:text}
.dbox textarea{height:220px;font-size:14px;font-family:monospace}
.drow{display:flex;gap:8px;flex-wrap:wrap}
.drow .btn{flex:1;font-size:19px;padding:0 12px}
.car{position:absolute;left:-27px;top:-27px;width:54px;height:54px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.carRot{width:54px;height:54px}
.pin{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:#fff;border:8px solid #22c3a6;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.num{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:#fff;color:#0b6e5f;border:4px solid #22c3a6;font:800 16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.bub{position:absolute;transform:translate(-50%,-50%);padding:6px 12px;border-radius:12px;font:700 17px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.45);white-space:nowrap;cursor:pointer}
.bub.s{background:#22c3a6;color:#04201b}
.bub.a{background:rgba(28,30,34,.92);color:#f4f5f7}
.bub small{font-weight:400;opacity:.85}
@media (max-width:700px){
  #panel{width:auto;right:calc(86px + env(safe-area-inset-right))}
  #bDist{font-size:34px}#bArrow{width:70px;height:70px;font-size:46px}
  #side .btn{width:50px;height:50px;font-size:21px}
  .rt .tm{font-size:21px;min-width:84px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="top">
    <div id="searchBox" class="glass">
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
      <button class="btn hidden" id="qCancel">✕</button>
      <button class="btn" id="qBtn">🔍</button>
    </div>
    <div id="results" class="glass hidden"></div>
  </div>

  <div id="banner" class="glass hidden">
    <div id="bArrow">↑</div>
    <div><div id="bDist"></div><div id="bText"></div></div>
  </div>

  <div id="card" class="glass hidden">
    <div id="stopsBox" class="stops"></div>
    <div id="routesBox" class="routes"></div>
    <div id="info"><div id="dName"></div><div id="dStats"></div></div>
    <div id="nextLine" class="nextstop"></div>
    <div id="steps"></div>
    <div id="actions">
      <button class="btn big green" id="go"></button>
      <button class="btn big" id="demo">Demo</button>
      <button class="btn big" id="list">☰</button>
      <button class="btn big" id="star">☆</button>
      <button class="btn big" id="skip">⏭</button>
      <button class="btn big" id="stop">✕</button>
    </div>
  </div>
</div>

<div id="side" class="glass">
  <button class="btn" id="zin">+</button>
  <button class="btn" id="zout">−</button>
  <button class="btn on" id="center">◎</button>
  <button class="btn" id="traffic">🚦</button>
  <button class="btn" id="layers">🗺</button>
  <button class="btn" id="theme">☀</button>
  <button class="btn" id="voice">🔊</button>
  <button class="btn lang" id="lang">EN</button>
  <button class="btn" id="fs">⛶</button>
  <button class="btn hidden" id="install">⬇</button>
</div>

<div id="speed" class="glass hidden"><span id="spd">0</span><small id="spdU"></small></div>
<div id="dlg" class="hidden"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= ключи Яндекса ================= */
const YKEY = 'fc5db2c9-c6bd-49fe-9ab7-71d08afae06a';      // JavaScript API
const YSUGGEST = 'f382b839-b555-4f50-82b6-7b45bb9769d5';  // API Геосаджеста

/* ================= утилиты ================= */
const $ = id => document.getElementById(id);
const show = (id, v) => $(id).classList.toggle('hidden', !v);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ngm_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ngm_'+k, JSON.stringify(v)); }catch(e){} }
};
const SIM = /[?&]sim=1/.test(location.search);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lc = s => s.charAt(0).toLowerCase() + s.slice(1);
let toastT;
function toast(msg, ms = 3000){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* ================= языки: EN / KA / RU ================= */
const LANGS = ['en', 'ka', 'ru'];
const API_LANG = { en:'en_US', ka:'en_US', ru:'ru_RU' };   // у Яндекса нет грузинского — карта на английском
const VOICE = { en:'en-US', ka:'ka-GE', ru:'ru-RU' };
let lang = store.get('lang', 'en'); if (!LANGS.includes(lang)) lang = 'en';

const L = {
en: {
  where:'Where to?', addStopPh:'Add a stop…', go:'Go', routeHere:'Route here', home:'Home', work:'Work',
  favs:'Favorites', recent:'Recent', edit:'Edit', done:'Done', exportFav:'Export for all devices',
  addStop:'Add stop', myLoc:'My location', fastest:'Fastest', jam:'traffic', eta:'ETA', via:'via',
  min:'min', h:'h', km:'km', m:'m', kmh:'km/h', then:'Then', stop:'Stop', point:'Point on map', coords:'Coordinates',
  building:'Finding routes…', noRoute:'Could not build a route', noTraffic:'no traffic data',
  searching:'Searching…', nothing:'Nothing found', searchErr:'Search error',
  noGps:'No GPS signal', gpsDenied:'Location access denied — allow it in browser settings', gpsNone:'Geolocation is not supported',
  waitGps:'Waiting for GPS…', fromCenter:'No GPS — routing from map center', rerouting:'Rerouting…',
  faster:n => 'Faster route found — saves ' + n + ' min', arrivedAt:n => 'Arrived: ' + n, stopDone:n => 'Stop reached: ' + n,
  stopAdded:'Stop added', trafficOn:'Traffic on', trafficOff:'Traffic off', voiceOn:'Voice on',
  map:'Map', hybrid:'Hybrid', sat:'Satellite', noFs:'Fullscreen is not available', apiFail:'Yandex map failed to load — check internet and API key',
  setHint:k => 'Find a place, tap ☆ and choose “' + k + '”', saveTitle:'Save place', name:'Name', save:'Favorite', cancel:'Cancel',
  saved:'Saved', removed:'Removed', copy:'Copy', copied:'Copied', close:'Close',
  exportHelp:'Paste this text into the file favorites.json in your GitHub repository — the list will appear on every device.',
  demoHint:'Demo mode: pick a place and press “Demo”', letsGo:'Let’s go', arrive:'You have arrived',
  sayStop:'You have reached your stop', onto:s => ' onto ' + s, rexit:n => 'At the roundabout, take exit ' + n,
  inDist:(d, t) => 'In ' + d + ' meters, ' + lc(t),
  turn:{ left:'Turn left', right:'Turn right', 'slight-left':'Bear left', 'slight-right':'Bear right',
    'sharp-left':'Turn sharp left', 'sharp-right':'Turn sharp right', uturn:'Make a U-turn', straight:'Continue straight',
    roundabout:'Enter the roundabout', 'exit-roundabout':'Exit the roundabout', merge:'Merge',
    'exit-left':'Take the exit on the left', 'exit-right':'Take the exit on the right', 'keep-left':'Keep left', 'keep-right':'Keep right' }
},
ka: {
  where:'სად მივდივართ?', addStopPh:'გაჩერების დამატება…', go:'წავედით', routeHere:'მარშრუტი აქ', home:'სახლი', work:'სამსახური',
  favs:'რჩეულები', recent:'ბოლო', edit:'რედაქტირება', done:'მზადაა', exportFav:'ექსპორტი ყველა მოწყობილობისთვის',
  addStop:'გაჩერების დამატება', myLoc:'ჩემი მდებარეობა', fastest:'უსწრაფესი', jam:'საცობი', eta:'ჩასვლა', via:'გავლით:',
  min:'წთ', h:'სთ', km:'კმ', m:'მ', kmh:'კმ/სთ', then:'შემდეგ', stop:'გაჩერება', point:'წერტილი რუკაზე', coords:'კოორდინატები',
  building:'მარშრუტების ძებნა…', noRoute:'მარშრუტი ვერ აიგო', noTraffic:'საცობების გარეშე',
  searching:'ძებნა…', nothing:'ვერაფერი მოიძებნა', searchErr:'ძებნის შეცდომა',
  noGps:'GPS სიგნალი არ არის', gpsDenied:'მდებარეობაზე წვდომა აკრძალულია — დაუშვით ბრაუზერის პარამეტრებში', gpsNone:'გეოლოკაცია არ არის მხარდაჭერილი',
  waitGps:'GPS-ის მოლოდინი…', fromCenter:'GPS არ არის — მარშრუტი რუკის ცენტრიდან', rerouting:'მარშრუტის განახლება…',
  faster:n => 'ნაპოვნია უფრო სწრაფი მარშრუტი — ' + n + ' წთ-ით ნაკლები', arrivedAt:n => 'მიხვედით: ' + n, stopDone:n => 'გაჩერება გავლილია: ' + n,
  stopAdded:'გაჩერება დაემატა', trafficOn:'საცობები ჩართულია', trafficOff:'საცობები გამორთულია', voiceOn:'ხმა ჩართულია',
  map:'რუკა', hybrid:'ჰიბრიდი', sat:'სატელიტი', noFs:'სრული ეკრანი მიუწვდომელია', apiFail:'რუკა ვერ ჩაიტვირთა — შეამოწმეთ ინტერნეტი და გასაღები',
  setHint:k => 'იპოვეთ ადგილი, დააჭირეთ ☆ და აირჩიეთ „' + k + '“', saveTitle:'ადგილის შენახვა', name:'სახელი', save:'რჩეული', cancel:'გაუქმება',
  saved:'შენახულია', removed:'წაშლილია', copy:'კოპირება', copied:'დაკოპირდა', close:'დახურვა',
  exportHelp:'ჩასვით ეს ტექსტი ფაილში favorites.json თქვენს GitHub რეპოზიტორიაში — სია გამოჩნდება ყველა მოწყობილობაზე.',
  demoHint:'დემო რეჟიმი: აირჩიეთ ადგილი და დააჭირეთ „Demo“', letsGo:'წავედით', arrive:'თქვენ მიხვედით დანიშნულების ადგილზე',
  sayStop:'თქვენ მიხვედით გაჩერებაზე', onto:s => ' · ' + s, rexit:n => 'წრიულზე — გასასვლელი ' + n,
  inDist:(d, t) => d + ' მეტრში ' + t,
  turn:{ left:'მოუხვიეთ მარცხნივ', right:'მოუხვიეთ მარჯვნივ', 'slight-left':'ოდნავ მარცხნივ', 'slight-right':'ოდნავ მარჯვნივ',

/* ================= геометрия и формат ================= */
const R = 6371000, rad = Math.PI / 180;
function hav(a, b){
  const dLat = (b[0]-a[0])*rad, dLng = (b[1]-a[1])*rad;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a, b){
  const y = Math.sin((b[1]-a[1])*rad)*Math.cos(b[0]*rad);
  const x = Math.cos(a[0]*rad)*Math.sin(b[0]*rad) - Math.sin(a[0]*rad)*Math.cos(b[0]*rad)*Math.cos((b[1]-a[1])*rad);
  return (Math.atan2(y, x)/rad + 360) % 360;
}
function segProj(p, a, b){
  const kx = 111320*Math.cos(p[0]*rad), ky = 110540;
  const ax = (a[1]-p[1])*kx, ay = (a[0]-p[0])*ky, bx = (b[1]-p[1])*kx, by = (b[0]-p[0])*ky;
  const dx = bx-ax, dy = by-ay, L2 = dx*dx + dy*dy;
  let t = L2 ? -(ax*dx + ay*dy)/L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return { d: Math.hypot(ax + t*dx, ay + t*dy), t };
}
const angDiff = (a, b) => ((b - a + 540) % 360) - 180;
function cumDist(coords){
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i-1] + hav(coords[i-1], coords[i]));
  return cum;
}
function fmtDist(m){
  const t = T(), dec = s => lang === 'en' ? s : s.replace('.', ',');
  if (m >= 10000) return Math.round(m/1000) + ' ' + t.km;
  if (m >= 1000) return dec((m/1000).toFixed(1)) + ' ' + t.km;
  if (m >= 100) return Math.round(m/50)*50 + ' ' + t.m;
  return Math.max(0, Math.round(m/10)*10) + ' ' + t.m;
}
function fmtTime(s){
  const t = T(), m = Math.max(1, Math.round(s/60));
  return m < 60 ? m + ' ' + t.min : Math.floor(m/60) + ' ' + t.h + ' ' + (m%60) + ' ' + t.min;
}

let favLocal = store.get('fav', []), favShared = [], favHidden = store.get('favHidden', []);
function favAll(){
  const seen = {}, out = [];
  favLocal.forEach(f => { const k = keyOf(f); if (!seen[k]){ seen[k] = 1; out.push(f); } });
  favShared.forEach(f => { const k = keyOf(f); if (!seen[k] && !favHidden.includes(k)){ seen[k] = 1; out.push(f); } });
  return out;
}
const favFind = p => p && favAll().find(f => keyOf(f) === keyOf(p));
const favKind = k => favAll().find(f => f.kind === k);
function favSave(p, kind, name){
  const k = keyOf(p);
  favLocal = favLocal.filter(f => keyOf(f) !== k && !(kind !== 'fav' && f.kind === kind));
  favHidden = favHidden.filter(h => h !== k);
  if (kind !== 'fav') favShared.forEach(f => { if (f.kind === kind && !favHidden.includes(keyOf(f))) favHidden.push(keyOf(f)); });
  favLocal.unshift({ kind, name: name || p.name, addr: p.addr || '', lat: p.lat, lng: p.lng });
  store.set('fav', favLocal); store.set('favHidden', favHidden);
}
function favRemove(p){
  const k = keyOf(p);
  favLocal = favLocal.filter(f => keyOf(f) !== k);
  if (favShared.some(f => keyOf(f) === k) && !favHidden.includes(k)) favHidden.push(k);
  store.set('fav', favLocal); store.set('favHidden', favHidden);
}
function loadShared(){

  }).catch(() => {});
}

function onPosition(lat, lng, acc, spd, hdg){
  const p = [lat, lng];
  if (hdg != null && !isNaN(hdg) && (spd == null || spd > 1)) heading = hdg;
  else if (lastPos && hav(lastPos, p) > 4) heading = bearing(lastPos, p);
  if (!lastPos || hav(lastPos, p) > 4) lastPos = p;
  pos = p; speed = (spd != null && !isNaN(spd)) ? spd : speed;

  if (!shown){ shown = p; shownHeading = heading; car.geometry.setCoordinates(p); car.options.set('visible', true); }
  animFrom = shown; target = p; animStart = performance.now();
  $('spd').textContent = Math.round(speed * 3.6);
  store.set('last', p);

  if (firstFix){ firstFix = false; if (state === 'idle') map.setCenter(p, 16); }
  if (state === 'nav'){
    updateNav(p);
    if (follow && state === 'nav'){
      const k = speed * 3.6, z = Math.max(10, Math.min(19, (k < 40 ? 17 : k < 80 ? 16 : 15) + zoomAdj));
      if (map.getZoom() !== z) map.setZoom(z, { duration: 400 });
      map.panTo(p, { duration: 950, flying: false });
    }
  } else if (follow && state === 'idle'){
    map.panTo(p, { duration: 800, flying: false });
  }
}
function frame(now){
  if (target && animFrom){
    const t = Math.min(1, (now - animStart) / 950);
    shown = [animFrom[0] + (target[0]-animFrom[0])*t, animFrom[1] + (target[1]-animFrom[1])*t];
    car.geometry.setCoordinates(shown);
    if (t >= 1) animFrom = null;
  }
  shownHeading = (shownHeading + angDiff(shownHeading, heading) * 0.15 + 360) % 360;
  const el = document.getElementById('carRot');
  if (el) el.style.transform = 'rotate(' + shownHeading + 'deg)';
  requestAnimationFrame(frame);
}
function startGeo(){
  if (!('geolocation' in navigator)){ toast(T().gpsNone, 5000); return; }
  navigator.geolocation.watchPosition(
    g => { if (simRunning) return; const c = g.coords; onPosition(c.latitude, c.longitude, c.accuracy, c.speed, c.heading); },
    e => toast(e.code === 1 ? T().gpsDenied : T().noGps, 5000),
    { enableHighAccuracy:true, maximumAge:1000, timeout:20000 }
  );
}

let sugT = null, sugSeq = 0, lastSug = [];
function suggest(v){
  const my = ++sugSeq;
  ymaps.suggest(v, { boundedBy: map.getBounds(), results: 7 }).then(items => {
    if (my !== sugSeq) return;
    lastSug = items.map(i => { const parts = String(i.displayName).split(', '); return { name: parts[0], addr: parts.slice(1).join(', '), value: i.value }; });
    if (!lastSug.length){ showMsg(T().nothing); return; }
    const box = $('results'); box.innerHTML = '';
    lastSug.forEach(s => box.appendChild(placeRow(s, { onPick: geocodePick })));
    box.classList.remove('hidden');
  }, () => { if (my === sugSeq) showMsg(T().searchErr); });
}
function geocodePick(it){
  showMsg(T().searching);
  ymaps.geocode(it.value, { results: 1, boundedBy: map.getBounds() }).then(res => {
    const g = res.geoObjects.get(0);
    if (!g){ showMsg(T().nothing); return; }
    const c = g.geometry.getCoordinates();
    choose({ name: it.name, addr: it.addr || g.getAddressLine(), lat: c[0], lng: c[1] });
  }, () => showMsg(T().searchErr));
}
function searchEnter(){
  const q = $('q').value.trim(); if (!q) return;
  const cm = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (cm){ choose({ name: T().coords, addr: cm[1] + ', ' + cm[2], lat: +cm[1], lng: +cm[2] }); return; }
  if (lastSug.length) geocodePick(lastSug[0]); else geocodePick({ name: q, value: q });
}

  hideResults(); $('q').blur(); $('q').value = ''; lastSug = [];
  const p = { name: it.name, addr: it.addr || '', lat: +it.lat, lng: +it.lng };
  addRecent(p);

      const street = (sg.properties && sg.properties.get('street')) || '';

      if (si > 0){ const act = normY(sg.properties && sg.properties.get('action')); if (act) marks.push({ idx: startIdx, act, street }); }

      pc.forEach((c, k) => { if (coords.length && k === 0) return; coords.push(c); });

function routeMulti(points){

    const timer = setTimeout(() => fin(false, new Error('timeout')), 12000);

    catch(e){ fin(false, e); return; }

        if (!list.length) throw new Error('empty');

function routeOld(points){

            sc.forEach((c, k) => { if (coords.length && k === 0) return; coords.push(c); });
            const street = sg.getStreet() || '';

function normO(m){

async function routeOSRM(points){
  const url = 'https://router.project-osrm.org/route/v1/driving/' + points.map(p => p[1] + ',' + p[0]).join(';') +

function updateNav(p){

  }

  const remain = Math.max(0, rt.total - progress);
  // промежуточная остановка

  if (st && stops.length > 1 && ((st.at - progress < 30 && bestD < 60) || hav(p, [stops[0].lat, stops[0].lng]) < 35)){
    st.done = true; const name = stops[0].name;

  }

  let j = rt.steps.findIndex(s => !s.done && s.at > progress + 5);
  if (j < 0) j = rt.steps.length - 1;
  const s = rt.steps[j], d = Math.max(0, s.at - progress);

    $('dName').textContent = t.stop + ' · ' + stops[0].name;

    $('nextLine').innerHTML = esc(t.then) + ': <b>' + esc(fin.name) + '</b> · ' + esc(fmtTime(tl)) + ' · ' + esc(t.eta) + ' ' + clock(tl);
  } else {

    $('dStats').innerHTML = esc(fmtDist(remain)) + ' · <b>' + esc(fmtTime(tl)) + '</b> · ' + esc(t.eta) + ' ' + clock(tl) +
      (routeSrc === 'osrm' ? ' · ' + esc(t.noTraffic) : '');
  }

  const said = rt.said[j] || (rt.said[j] = {});

  say(l => L[l].arrive); toast(T().arrivedAt(name), 5000); cancelAll();
}

/* ================= экран не гаснет ================= */
let wake = null;
async function requestWake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){} }
function releaseWake(){ try { if (wake) wake.release(); } catch(e){} wake = null; }
document.addEventListener('visibilitychange', () => { if (state === 'nav' && document.visibilityState === 'visible') requestWake(); });

/* ================= демо-режим (?sim=1) ================= */
function startSim(){
  if (!route) return;
  if (state !== 'nav') startNav();
  simRunning = true;
  const c = route.coords.slice(), v = 14;
  let i = 0, f = 0;
  clearInterval(simTimer);
  simTimer = setInterval(() => {
    let left = v;
    while (left > 0 && i < c.length - 1){
      const L_ = hav(c[i], c[i+1]);
      if (L_ === 0){ i++; f = 0; continue; }
      const rest = L_ * (1 - f);
      if (left < rest){ f += left / L_; left = 0; } else { left -= rest; i++; f = 0; }
    }
    const cur = i >= c.length - 1 ? c[c.length-1] : [c[i][0] + (c[i+1][0]-c[i][0])*f, c[i][1] + (c[i+1][1]-c[i][1])*f];
    const end = i >= c.length - 1;
    onPosition(cur[0], cur[1], 5, v, null);
    if (end) stopSim();
  }, 1000);
}
function stopSim(){ clearInterval(simTimer); simTimer = null; simRunning = false; }

/* ================= приложение: установка, весь экран ================= */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').classList.remove('hidden'); });
$('install').onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; $('install').classList.add('hidden'); };
const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
if (standalone || !document.documentElement.requestFullscreen) $('fs').classList.add('hidden');
$('fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => toast(T().noFs));
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ================= кнопки ================= */
$('qBtn').onclick = searchEnter;
$('qCancel').onclick = () => { adding = false; hideResults(); $('q').value = ''; $('q').blur(); render(); };
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') searchEnter(); });
$('q').addEventListener('focus', () => { if (!$('q').value.trim()) showHome(); });
$('q').addEventListener('input', () => {
  const v = $('q').value.trim(); clearTimeout(sugT); lastSug = []; sugSeq++;
  if (!v){ showHome(); return; }
  sugT = setTimeout(() => suggest(v), 250);
});
$('go').onclick = () => { if (state === 'pick' && pick) choose(pick); else if (state === 'preview') startNav(); };
$('stop').onclick = cancelAll;
$('demo').onclick = startSim;
$('list').onclick = () => { stepsOpen = !stepsOpen; render(); };
$('star').onclick = () => {
  const p = state === 'pick' ? pick : stops[stops.length - 1]; if (!p) return;
  if (favFind(p)){ favRemove(p); toast(T().removed, 1500); render(); } else openSaveDlg(p);
};
$('skip').onclick = () => { if (state === 'nav' && stops.length > 1){ stops.shift(); drawStops(); render(); lastReroute = 0; reroute(); } };
$('zin').onclick = () => { if (state === 'nav' && follow) zoomAdj++; map.setZoom(map.getZoom() + 1, { duration: 200 }); };
$('zout').onclick = () => { if (state === 'nav' && follow) zoomAdj--; map.setZoom(map.getZoom() - 1, { duration: 200 }); };
$('center').onclick = () => {
  setFollow(true);
  if (!pos){ toast(T().waitGps); return; }
  zoomAdj = 0; map.setCenter(pos, state === 'nav' ? 17 : 16, { duration: 500 });
};
$('traffic').onclick = () => { trafficOn = !trafficOn; applyTraffic(); toast(trafficOn ? T().trafficOn : T().trafficOff, 1200); };
$('layers').onclick = () => { mtype = (mtype + 1) % 3; applyMapType(); };
$('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); };
$('voice').onclick = () => { voiceOn = !voiceOn; applyVoice(); if (voiceOn) say(l => L[l].voiceOn); };
$('lang').onclick = () => { store.set('lang', LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]); location.reload(); };
