<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation</title>
<style>
  :root { --bg:#14171a; --fg:#e8eaec; --mut:#9aa3ab; --line:#2f363d; --blue:#3b8cf0; --red:#e5604d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  #map { position:absolute; inset:0; }
  .card { position:absolute; background:var(--bg); border:1px solid var(--line); border-radius:12px; }
  #top { top:12px; left:12px; right:12px; display:flex; gap:10px; padding:10px; z-index:5; max-width:760px; }
  #q { flex:1; font-size:22px; padding:12px 14px; border-radius:8px; border:1px solid var(--line);
       background:#22272d; color:var(--fg); min-width:0; }
  button { font-size:20px; padding:12px 20px; border-radius:8px; border:1px solid var(--line);
           background:#22272d; color:var(--fg); }
  #go { background:var(--blue); border-color:var(--blue); color:#fff; }
  #msg { top:96px; left:12px; padding:10px 14px; font-size:18px; color:var(--mut); display:none; z-index:5; max-width:700px; }
  #me { right:12px; top:96px; z-index:5; }
  #info { left:12px; right:12px; bottom:12px; padding:14px 18px; display:none; gap:14px; align-items:center; z-index:5; max-width:760px; }
  #info .main { flex:1; min-width:0; }
  #name { font-size:22px; font-weight:500; }
  #desc { font-size:16px; color:var(--mut); margin-top:2px; }
  #route { background:var(--blue); border-color:var(--blue); color:#fff; }
  #cancel { background:var(--red); border-color:var(--red); color:#fff; }
  ymaps[class*="suggest"] { font-size:20px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="card">
  <input id="q" type="text" placeholder="Where to?" autocomplete="off">
  <button id="go">Search</button>
</div>
<div id="msg" class="card"></div>
<button id="me" class="card" aria-label="My location">My location</button>
<div id="info" class="card">
  <div class="main">
    <div id="name"></div>
    <div id="desc"></div>
  </div>
  <button id="route">Start route</button>
  <button id="cancel">Cancel</button>
</div>

<script>
  var KEY = "fc5db2c9-c6bd-49fe-9ab7-71d08afae06a";
  var SUGGEST_KEY = "f382b839-b555-4f50-82b6-7b45bb9769d5";
  var GEO_KEY = "55379b3b-a1e2-45b3-b313-b8d446e39970";
  var LANG = "en_US";

  var map, mePoint = null, meMark = null, destMark = null, dest = null, follow = true;
  var $ = function (id) { return document.getElementById(id); };

  function say(t) {
    var m = $("msg");
    if (!t) { m.style.display = "none"; return; }
    m.textContent = t; m.style.display = "block";
  }

  function init() {
    map = new ymaps.Map("map", { center:[41.7151, 44.8271], zoom:12, controls:["zoomControl", "trafficControl"] });
    new ymaps.SuggestView("q");

    navigator.geolocation.watchPosition(function (p) {
      mePoint = [p.coords.latitude, p.coords.longitude];
      if (!meMark) {
        meMark = new ymaps.Placemark(mePoint, {}, { preset:"islands#geolocationIcon" });
        map.geoObjects.add(meMark);
        map.setCenter(mePoint, 15);
      } else {
        meMark.geometry.setCoordinates(mePoint);
        if (follow && !dest) map.setCenter(mePoint);
      }
    }, function (e) { say("No location: " + e.message); },
    { enableHighAccuracy:true, maximumAge:1000 });

    $("go").onclick = search;
    $("q").onkeydown = function (e) { if (e.key === "Enter") search(); };
    $("me").onclick = function () { follow = true; if (mePoint) map.setCenter(mePoint, 16); };
    $("cancel").onclick = clearDest;
    $("route").onclick = startRoute;
    map.events.add("actionbegin", function () { follow = false; });
  }

  function search() {
    var text = $("q").value.trim();
    if (!text) { say("Enter an address or place"); return; }
    say("Searching…");
    var c = mePoint || map.getCenter();
    var url = "https://geocode-maps.yandex.ru/1.x/?format=json&results=1&lang=" + LANG +
      "&apikey=" + GEO_KEY + "&ll=" + c[1] + "," + c[0] + "&spn=0.5,0.5" +
      "&geocode=" + encodeURIComponent(text);
    fetch(url).then(function (resp) {
      if (!resp.ok) throw new Error("Geocoder responded with code " + resp.status);
      return resp.json();
    }).then(function (d) {
      var m = d.response.GeoObjectCollection.featureMember;
      if (!m.length) { say("Nothing found. Refine the address."); return; }
      var g = m[0].GeoObject, pos = g.Point.pos.split(" ");
      say("");
      showDest([parseFloat(pos[1]), parseFloat(pos[0])], g.name, g.description || "");
    }).catch(function (e) { say("Search error: " + e.message); });
  }

  function showDest(pt, name, desc) {
    clearDest();
    dest = pt;
    destMark = new ymaps.Placemark(pt, {}, { preset:"islands#redDotIcon" });
    map.geoObjects.add(destMark);
    map.setCenter(pt, 15);
    $("name").textContent = name;
    $("desc").textContent = desc;
    $("info").style.display = "flex";
  }

  function clearDest() {
    if (destMark) { map.geoObjects.remove(destMark); destMark = null; }
    dest = null;
    $("info").style.display = "none";
    say("");
  }

  // Opens the route in Yandex Maps (real Yandex route with traffic and ETA)
  function startRoute() {
    if (!dest) return;
    var from = mePoint ? mePoint[0] + "," + mePoint[1] : "";
    var url = "https://yandex.com/maps/?rtext=" + from + "~" + dest[0] + "," + dest[1] + "&rtt=auto";
    window.location.href = url;
  }

  var s = document.createElement("script");
  s.src = "https://api-maps.yandex.ru/2.1/?apikey=" + KEY + "&suggest_apikey=" + SUGGEST_KEY + "&lang=" + LANG;
  s.onload = function () { ymaps.ready(init); };
  s.onerror = function () { say("Map failed to load"); };
  document.head.appendChild(s);
</script>
</body>
</html>
