<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Tesla Navigation</title>

    <!-- Yandex Maps JavaScript API 3.0 -->
    <script src="https://api-maps.yandex.ru/v3/?apikey=fc5db2c9-c6bd-49fe-9ab7-71d08afae06a&lang=en_US"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #top {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;

            display: flex;
            gap: 10px;
        }

        #status {
            position: fixed;
            bottom: 25px;
            left: 20px;
            z-index: 1000;

            background: rgba(0,0,0,0.75);
            color: white;

            padding: 12px 18px;
            border-radius: 12px;

            font-size: 18px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 20px;

            background: white;
            color: black;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        #locationButton {
            position: fixed;
            right: 20px;
            bottom: 25px;

            width: 65px;
            height: 65px;

            padding: 0;

            border-radius: 50%;

            font-size: 28px;

            z-index: 1000;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="top">
    <button onclick="findMyLocation()">📍 My location</button>
</div>

<div id="status">
    Initializing...
</div>

<button id="locationButton"
        onclick="findMyLocation()">
    📍
</button>


<script>

let map;
let myPosition = null;

async function initMap() {

    try {

        document.getElementById("status").innerText =
            "Loading Yandex Maps...";

        await ymaps3.ready;

        const {
            YMap,
            YMapDefaultSchemeLayer
        } = ymaps3;

        map = new YMap(
            document.getElementById("map"),
            {
                location: {
                    center: [44.8015, 41.6938],
                    zoom: 12
                }
            }
        );

        map.addChild(
            new YMapDefaultSchemeLayer()
        );

        document.getElementById("status").innerText =
            "Yandex Maps ready";

        findMyLocation();

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Yandex Maps ERROR";

    }
}


function findMyLocation() {

    if (!navigator.geolocation) {

        document.getElementById("status").innerText =
            "GPS is not supported";

        return;
    }

    document.getElementById("status").innerText =
        "Getting GPS position...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            myPosition = [lon, lat];

            console.log(
                "GPS:",
                lat,
                lon
            );

            map.setLocation({
                center: [lon, lat],
                zoom: 16,
                duration: 500
            });

            document.getElementById("status").innerText =
                "GPS: " +
                lat.toFixed(6) +
                ", " +
                lon.toFixed(6);

        },

        function(error) {

            console.error(error);

            let message = "GPS error";

            if (error.code === 1) {
                message =
                    "GPS permission denied";
            }

            if (error.code === 2) {
                message =
                    "GPS position unavailable";
            }

            if (error.code === 3) {
                message =
                    "GPS timeout";
            }

            document.getElementById("status").innerText =
                message;
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 5000
        }
    );
}


initMap();

</script>

</body>
</html>
