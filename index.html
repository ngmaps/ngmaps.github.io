<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навигация</title>
<style>
  :root { --bg:#14171a; --fg:#e8eaec; --mut:#9aa3ab; --line:#2f363d; --blue:#3b8cf0; --red:#e5604d; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  #map { position:absolute; inset:0; }
  .card { position:absolute; background:var(--bg); border:1px solid var(--line); border-radius:12px; }
  #top { top:12px; left:12px; right:12px; display:flex; gap:10px; padding:10px; z-index:5; max-width:760px; }
  #q { flex:1; font-size:22px; padding:12px 14px; border-radius:8px; border:1px solid var(--line);
       background:#22272d; color:var(--fg); min-width:0; }
  button { font-size:20px; padding:12px 20px; border-radius:8px; border:1px solid var(--line);
           background:#22272d; color:var(--fg); }
  #go { background:var(--blue); border-color:var(--blue); color:#fff; }
  #msg { top:96px; left:12px; padding:10px 14px; font-size:18px; color:var(--mut); display:none; z-index:5; }
  #me { right:12px; top:96px; z-index:5; }
  #info { left:12px; right:12px; bottom:12px; padding:14px 18px; display:none; gap:18px; align-items:center; z-index:5; max-width:760px; }
  #info .main { flex:1; min-width:0; }
  #sum { font-size:26px; font-weight:500; }
  #sum small { font-size:17px; font-weight:400; color:var(--mut); }
  #next { font-size:18px; color:var(--mut); margin-top:4px; }
  #cancel { background:var(--red); border-color:var(--red); color:#fff; }
  ymaps[class*="suggest"] { font-size:20px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="card">
  <input id="q" type="text" placeholder="Куда едем?" autocomplete="off">
  <button id="go">Найти</button>
</div>
<div id="msg" class="card"></div>
<button id="me" class="card" aria-label="Моя позиция">Я здесь</button>
<div id="info" class="card">
  <div class="main">
    <div id="sum"></div>
    <div id="next"></div>
  </div>
  <button id="cancel">Отмена</button>
</div>

<script>
  var KEY = "fc5db2c9-c6bd-49fe-9ab7-71d08afae06a";
  var SUGGEST_KEY = "f382b839-b555-4f50-82b6-7b45bb9769d5";
  var GEO_KEY = "55379b3b-a1e2-45b3-b313-b8d446e39970";

  var map, mePoint = null, meMark = null, route = null, follow = true;
  var $ = function (id) { return document.getElementById(id); };

  function say(t) {
    var m = $("msg");
    if (!t) { m.style.display = "none"; return; }
    m.textContent = t; m.style.display = "block";
  }

  function init() {
    map = new ymaps.Map("map", { center:[41.7151, 44.8271], zoom:12, controls:["zoomControl"] });
    new ymaps.SuggestView("q");

    navigator.geolocation.watchPosition(function (p) {
      mePoint = [p.coords.latitude, p.coords.longitude];
      if (!meMark) {
        meMark = new ymaps.Placemark(mePoint, {}, { preset:"islands#geolocationIcon" });
        map.geoObjects.add(meMark);
        map.setCenter(mePoint, 15);
      } else {
        meMark.geometry.setCoordinates(mePoint);
        if (follow && !route) map.setCenter(mePoint);
      }
    }, function (e) { say("Нет геопозиции: " + e.message); },
    { enableHighAccuracy:true, maximumAge:1000 });

    $("go").onclick = search;
    $("q").onkeydown = function (e) { if (e.key === "Enter") search(); };
    $("me").onclick = function () { follow = true; if (mePoint) map.setCenter(mePoint, 16); };
    $("cancel").onclick = clearRoute;
    map.events.add("actionbegin", function () { follow = false; });
  }

  function search() {
    var text = $("q").value.trim();
    if (!text) { say("Введите адрес или место"); return; }
    say(mePoint ? "Ищу…" : "Геопозиции нет, маршрут от центра карты. Ищу…");
    var c = mePoint || map.getCenter();
    var url = "https://geocode-maps.yandex.ru/1.x/?format=json&results=1&lang=ru_RU" +
      "&apikey=" + GEO_KEY + "&ll=" + c[1] + "," + c[0] + "&spn=0.5,0.5" +
      "&geocode=" + encodeURIComponent(text);
    fetch(url).then(function (resp) {
      if (!resp.ok) throw new Error("Геокодер ответил кодом " + resp.status);
      return resp.json();
    }).then(function (d) {
      var m = d.response.GeoObjectCollection.featureMember;
      if (!m.length) { say("Ничего не найдено. Уточните адрес."); return; }
      var pos = m[0].GeoObject.Point.pos.split(" ");
      say("");
      buildRoute([parseFloat(pos[1]), parseFloat(pos[0])]);
    }).catch(function (e) { say("Ошибка поиска: " + e.message); });
  }

  function buildRoute(dest) {
    clearRoute();
    route = new ymaps.multiRouter.MultiRoute(
      { referencePoints:[mePoint || map.getCenter(), dest], params:{ routingMode:"auto", results:1 } },
      { boundsAutoApply:true, routeActiveStrokeWidth:9, routeActiveStrokeColor:"#3b8cf0" }
    );
    map.geoObjects.add(route);
    route.model.events.add("requestsuccess", function () {
      var a = route.getActiveRoute();
      if (!a) return;
      var dist = a.properties.get("distance").text;
      var dur = (a.properties.get("durationInTraffic") || a.properties.get("duration")).text;
      $("sum").innerHTML = dur + ' <small>· ' + dist + '</small>';
      var seg = a.getPaths().get(0).getSegments().get(0);
      $("next").textContent = seg ? "Далее: " + seg.properties.get("text") : "";
      $("info").style.display = "flex";
    });
    route.model.events.add("requestfail", function () { say("Маршрут не построен"); });
  }

  function clearRoute() {
    if (route) { map.geoObjects.remove(route); route = null; }
    $("info").style.display = "none";
    say("");
  }

  var s = document.createElement("script");
  s.src = "https://api-maps.yandex.ru/2.1/?apikey=" + KEY + "&suggest_apikey=" + SUGGEST_KEY + "&lang=ru_RU";
  s.onload = function () { ymaps.ready(init); };
  s.onerror = function () { say("Карта не загрузилась"); };
  document.head.appendChild(s);
</script>
</body>
</html>
