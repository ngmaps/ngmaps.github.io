<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>NG Maps</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:rgba(28,30,34,.80);--bg2:rgba(255,255,255,.07);--fg:#f4f5f7;--mut:#9aa0a8;--acc:#22c3a6;--accfg:#04201b;--line:rgba(255,255,255,.08)}
body.light{--bg:rgba(250,250,251,.85);--bg2:rgba(0,0,0,.05);--fg:#16181c;--mut:#6b7079;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;background:#0e0f11}
#map{position:absolute;inset:0}
.hidden{display:none!important}
.glass{background:var(--bg);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.btn{background:var(--bg2);color:var(--fg);border:none;border-radius:16px;font-size:22px;min-width:56px;height:56px;padding:0 20px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.btn:active{transform:scale(.95)}
.green{background:var(--acc);color:var(--accfg);font-weight:600}
.big{height:64px;font-size:22px;padding:0 28px}
#panel{position:absolute;top:20px;left:20px;bottom:20px;width:min(440px,calc(100% - 130px));display:flex;flex-direction:column;gap:14px;z-index:1000;pointer-events:none}
#panel>*{pointer-events:auto}
#top{display:flex;flex-direction:column;gap:10px}
#searchBox{display:flex;align-items:center;gap:6px;border-radius:22px;padding:6px 6px 6px 20px}
#q{flex:1;min-width:0;height:56px;font-size:22px;border:none;background:transparent;color:var(--fg);outline:none;font-family:inherit}
#q::placeholder{color:var(--mut)}
#qBtn{background:transparent}
#results{border-radius:22px;max-height:60vh;overflow:auto;padding:6px}
.item{padding:14px 16px;border-radius:14px;cursor:pointer}
.item:active{background:var(--bg2)}
.nm{color:var(--fg);font-size:21px;display:flex;justify-content:space-between;gap:12px}
.ad{color:var(--mut);font-size:16px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{color:var(--acc);font-size:17px;white-space:nowrap}
.msg,.hdr{padding:12px 16px;color:var(--mut);font-size:16px;text-transform:uppercase;letter-spacing:.8px}
#banner{border-radius:22px;display:flex;align-items:center;gap:18px;padding:18px 22px}
#bArrow{width:86px;height:86px;border-radius:20px;background:var(--acc);color:var(--accfg);font-size:58px;display:flex;align-items:center;justify-content:center;flex:none}
#bDist{font-size:42px;font-weight:700;color:var(--fg);line-height:1.1}
#bText{font-size:21px;color:var(--mut);margin-top:4px}
#bottom{margin-top:auto;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0}
#dName{font-size:22px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dStats{color:var(--mut);font-size:19px;margin-top:6px}
#steps{overflow:auto;min-height:0;max-height:38vh;border-top:1px solid var(--line);padding-top:6px}
.st{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:none}
.st .a{width:40px;height:40px;border-radius:12px;background:var(--bg2);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.st .t{flex:1;color:var(--fg);font-size:18px}
.st .d{color:var(--mut);font-size:16px;white-space:nowrap}
#actions{display:flex;gap:10px}
#actions #go{flex:1}
#side{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;border-radius:24px;padding:6px;gap:4px;z-index:1000}
#side .btn{width:64px;height:64px;background:transparent;font-size:26px;padding:0}
#side .btn.on{background:var(--acc);color:var(--accfg)}
#speed{position:absolute;right:20px;bottom:24px;z-index:1000;width:104px;height:104px;border-radius:50%;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:700}
#speed small{font-size:14px;font-weight:400;color:var(--mut)}
#toast{position:absolute;left:50%;top:24px;transform:translate(-50%,-20px);background:var(--bg);color:var(--fg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);padding:14px 26px;border-radius:18px;font-size:19px;z-index:2000;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.car{background:none;border:none}
.pin{width:30px;height:30px;border-radius:50%;background:#fff;border:8px solid var(--acc);box-shadow:0 3px 12px rgba(0,0,0,.5)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);backdrop-filter:blur(18px);border-radius:18px}
.leaflet-popup-content{margin:10px}
.leaflet-container a.leaflet-popup-close-button{display:none}
.leaflet-control-attribution{font-size:11px;background:transparent!important;color:var(--mut)}
.leaflet-control-attribution a{color:var(--mut)}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="top">
    <div id="searchBox" class="glass">
      <input id="q" type="search" placeholder="Куда едем?" autocomplete="off" enterkeyhint="search">
      <button class="btn" id="qBtn" title="Найти">🔍</button>
    </div>
    <div id="results" class="glass hidden"></div>
  </div>

  <div id="banner" class="glass hidden">
    <div id="bArrow">↑</div>
    <div><div id="bDist"></div><div id="bText"></div></div>
  </div>

  <div id="bottom" class="glass hidden">
    <div id="info"><div id="dName"></div><div id="dStats"></div></div>
    <div id="steps"></div>
    <div id="actions">
      <button class="btn big green" id="go">Поехали</button>
      <button class="btn big hidden" id="demo">Демо</button>
      <button class="btn big" id="stop" title="Отмена">✕</button>
    </div>
  </div>
</div>

<div id="side" class="glass">
  <button class="btn" id="zin" title="Приблизить">+</button>
  <button class="btn" id="zout" title="Отдалить">−</button>
  <button class="btn on" id="center" title="Следовать за машиной">◎</button>
  <button class="btn" id="theme" title="День/ночь">☀</button>
  <button class="btn" id="voice" title="Голос">🔊</button>
</div>

<div id="speed" class="glass hidden"><span id="spd">0</span><small>км/ч</small></div>

<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
/* ================= утилиты ================= */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ngm_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ngm_'+k, JSON.stringify(v)); }catch(e){} }
};
const SIM = /[?&]sim=1/.test(location.search);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lc = s => s.charAt(0).toLowerCase() + s.slice(1);

let toastT;
function toast(msg, ms = 3000){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* ================= геометрия ================= */
const R = 6371000, rad = Math.PI / 180;
function hav(a, b){
  const dLat = (b[0]-a[0])*rad, dLng = (b[1]-a[1])*rad;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a, b){
  const y = Math.sin((b[1]-a[1])*rad)*Math.cos(b[0]*rad);
  const x = Math.cos(a[0]*rad)*Math.sin(b[0]*rad) - Math.sin(a[0]*rad)*Math.cos(b[0]*rad)*Math.cos((b[1]-a[1])*rad);
  return (Math.atan2(y, x)/rad + 360) % 360;
}
// расстояние от точки p до отрезка a-b (в метрах) и позиция проекции t∈[0,1]
function segProj(p, a, b){
  const kx = 111320*Math.cos(p[0]*rad), ky = 110540;
  const ax = (a[1]-p[1])*kx, ay = (a[0]-p[0])*ky, bx = (b[1]-p[1])*kx, by = (b[0]-p[0])*ky;
  const dx = bx-ax, dy = by-ay, L2 = dx*dx + dy*dy;
  let t = L2 ? -(ax*dx + ay*dy)/L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return { d: Math.hypot(ax + t*dx, ay + t*dy), t };
}

/* ================= форматирование ================= */
function fmtDist(m){
  if (m >= 10000) return Math.round(m/1000) + ' км';
  if (m >= 1000) return (m/1000).toFixed(1).replace('.', ',') + ' км';
  if (m >= 100) return Math.round(m/50)*50 + ' м';
  return Math.max(0, Math.round(m/10)*10) + ' м';
}
function fmtTime(s){
  const m = Math.max(1, Math.round(s/60));
  return m < 60 ? m + ' мин' : Math.floor(m/60) + ' ч ' + (m%60) + ' мин';
}
const clock = sec => new Date(Date.now() + sec*1000).toTimeString().slice(0, 5);

/* ================= манёвры ================= */
const DIR = {left:'налево', right:'направо', 'slight left':'плавно налево', 'slight right':'плавно направо',
  'sharp left':'резко налево', 'sharp right':'резко направо', straight:'прямо', uturn:'на разворот'};
const ARROW = {left:'↰', right:'↱', 'slight left':'↖', 'slight right':'↗', 'sharp left':'↰', 'sharp right':'↱', straight:'↑', uturn:'↶'};
function arrowOf(s){
  const m = s.maneuver;
  if (m.type === 'arrive') return '🏁';
  if (m.type === 'roundabout' || m.type === 'rotary') return '⟳';
  return ARROW[m.modifier] || '↑';
}
function textOf(s){
  const m = s.maneuver, t = m.type, mod = m.modifier || '', dir = DIR[mod] || '';
  const on = s.name ? ' на ' + s.name : '';
  const side = mod.includes('left') ? 'левее' : 'правее';
  switch (t){
    case 'depart': return 'Начните движение' + on;
    case 'arrive': return 'Вы прибыли';
    case 'roundabout': case 'rotary': return 'На круге — ' + (m.exit ? m.exit + '-й съезд' : 'съезд') + on;
    case 'exit roundabout': case 'exit rotary': return 'Съезд с круга' + on;
    case 'fork': return 'Держитесь ' + side + on;
    case 'merge': return 'Перестройтесь ' + side + on;
    case 'on ramp': case 'off ramp': return 'Съезд ' + dir + on;
    case 'end of road': return 'В конце дороги ' + dir + on;
  }
  if (mod === 'uturn') return 'Развернитесь' + on;
  if (mod === 'straight') return 'Продолжайте прямо' + on;
  return 'Поверните ' + dir + on;
}

/* ================= голос ================= */
let voiceOn = store.get('voice', true);
function speak(text){
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; speechSynthesis.speak(u); } catch(e){}
}
function applyVoice(){ $('voice').textContent = voiceOn ? '🔊' : '🔇'; store.set('voice', voiceOn); }

/* ================= карта ================= */
const map = L.map('map', { zoomControl:false, tap:true }).setView(store.get('last', [41.7151, 44.8271]), 13);
const tileOpt = { maxZoom:20, subdomains:'abcd', attribution:'© OpenStreetMap © CARTO' };
const tiles = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', tileOpt),
  light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', tileOpt)
};
let theme = store.get('theme', 'dark');
function applyTheme(){
  Object.values(tiles).forEach(t => map.removeLayer(t));
  tiles[theme].addTo(map);
  document.body.classList.toggle('light', theme === 'light');
  $('theme').textContent = theme === 'dark' ? '☀' : '☾';
  store.set('theme', theme);
}

/* ================= позиция ================= */
const carIcon = L.divIcon({ className:'car', iconSize:[46,46], iconAnchor:[23,23],
  html:'<div><svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3 L34 35 L20 27 L6 35 Z" fill="#22c3a6" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>' });
const pinIcon = L.divIcon({ className:'', html:'<div class="pin"></div>', iconSize:[30,30], iconAnchor:[15,36] });

let car = null, accCircle = null, pos = null, lastPos = null, heading = 0, follow = true, firstFix = true;

function setFollow(v){ follow = v; $('center').classList.toggle('on', v); }

function onPosition(lat, lng, acc, spd, hdg){
  const p = [lat, lng];
  if (hdg != null && !isNaN(hdg) && (spd == null || spd > 1)) heading = hdg;
  else if (lastPos && hav(lastPos, p) > 4) heading = bearing(lastPos, p);
  if (!lastPos || hav(lastPos, p) > 4) lastPos = p;
  pos = p;

  if (!car){
    accCircle = L.circle(p, { radius:acc||0, color:'#22c3a6', weight:1, fillOpacity:.1, interactive:false }).addTo(map);
    car = L.marker(p, { icon:carIcon, zIndexOffset:1000, interactive:false }).addTo(map);
  } else {
    car.setLatLng(p); accCircle.setLatLng(p).setRadius(acc||0);
  }
  const el = car.getElement();
  if (el && el.firstChild) el.firstChild.style.transform = 'rotate(' + heading + 'deg)';
  if (spd != null && !isNaN(spd)) $('spd').textContent = Math.round(spd*3.6);
  store.set('last', p);

  if (firstFix){ firstFix = false; if (!route) map.setView(p, 16); }
  if (state === 'nav'){
    updateNav(p);
    if (follow) map.setView(p, Math.max(map.getZoom(), 17), { animate:true });
  } else if (follow && !route) map.panTo(p);
}

let simRunning = false;
function startGeo(){
  if (!('geolocation' in navigator)){ toast('Геолокация не поддерживается этим браузером', 5000); return; }
  navigator.geolocation.watchPosition(
    g => { if (simRunning) return; const c = g.coords; onPosition(c.latitude, c.longitude, c.accuracy, c.speed, c.heading); },
    e => toast(e.code === 1 ? 'Доступ к геолокации запрещён — разрешите его в настройках браузера' : 'Нет сигнала GPS', 5000),
    { enableHighAccuracy:true, maximumAge:1000, timeout:20000 }
  );
}

/* ================= поиск ================= */
function renderList(items, header){
  const box = $('results'); box.innerHTML = header ? '<div class="hdr">' + esc(header) + '</div>' : '';
  items.forEach(it => {
    const d = document.createElement('div'); d.className = 'item';
    const dist = pos ? '<span class="dist">' + fmtDist(hav(pos, [it.lat, it.lng])) + '</span>' : '';
    d.innerHTML = '<div class="nm"><span>' + esc(it.name) + '</span>' + dist + '</div><div class="ad">' + esc(it.addr || '') + '</div>';
    d.onclick = () => { hideResults(); $('q').blur(); setDest(it); };
    box.appendChild(d);
  });
  box.classList.remove('hidden');
}
function showMsg(m){ const box = $('results'); box.innerHTML = '<div class="msg">' + esc(m) + '</div>'; box.classList.remove('hidden'); }
function hideResults(){ $('results').classList.add('hidden'); }
function showRecent(){ const r = store.get('recent', []); if (r.length) renderList(r, 'Недавние'); else hideResults(); }

async function search(){
  const q = $('q').value.trim(); if (!q) return;
  const cm = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (cm){ hideResults(); $('q').blur(); setDest({ name:'Координаты', addr:cm[1]+', '+cm[2], lat:+cm[1], lng:+cm[2] }); return; }
  const c = pos || [map.getCenter().lat, map.getCenter().lng];
  const vb = [c[1]-1.5, c[0]+1.5, c[1]+1.5, c[0]-1.5].join(',');
  showMsg('Ищу…');
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&accept-language=ru&viewbox=' + vb + '&q=' + encodeURIComponent(q));
    const data = await r.json();
    if (!data.length){ showMsg('Ничего не найдено'); return; }
    renderList(data.map(d => ({ name: d.name || d.display_name.split(',')[0], addr: d.display_name, lat: +d.lat, lng: +d.lon })));
  } catch(e){ showMsg('Ошибка поиска — проверьте интернет'); }
}

function addRecent(it){
  let r = store.get('recent', []);
  r = r.filter(x => Math.abs(x.lat-it.lat) > 1e-5 || Math.abs(x.lng-it.lng) > 1e-5);
  r.unshift({ name:it.name, addr:it.addr, lat:it.lat, lng:it.lng });
  store.set('recent', r.slice(0, 10));
}

/* ================= маршрут ================= */
let dest = null, destMarker = null, route = null, routeLayers = [], state = 'idle';

async function setDest(it){
  if (state === 'nav') stopNav();
  dest = it; addRecent(it);
  if (destMarker) map.removeLayer(destMarker);
  destMarker = L.marker([it.lat, it.lng], { icon:pinIcon }).addTo(map);
  $('dName').textContent = it.name; $('dStats').textContent = 'Строю маршрут…';
  $('bottom').classList.remove('hidden'); $('steps').classList.add('hidden'); $('go').classList.add('hidden'); $('demo').classList.add('hidden');
  if (await buildRoute()){
    state = 'preview';
    $('dStats').textContent = fmtDist(route.total) + ' · ' + fmtTime(route.duration) + ' · прибытие ' + clock(route.duration);
    $('go').classList.remove('hidden'); if (SIM) $('demo').classList.remove('hidden');
    setFollow(false);
    renderSteps(); $('steps').classList.remove('hidden');
    const wide = innerWidth > 900;
    map.fitBounds(routeLayers[1].getBounds(), { paddingTopLeft:[wide ? 490 : 40, 60], paddingBottomRight:[110, 60] });
  }
}

async function buildRoute(){
  const from = pos || [map.getCenter().lat, map.getCenter().lng];
  if (!pos) toast('Нет GPS — маршрут от центра карты');
  const url = 'https://router.project-osrm.org/route/v1/driving/' + from[1] + ',' + from[0] + ';' + dest.lng + ',' + dest.lat +
              '?overview=full&geometries=geojson&steps=true';
  try {
    const r = await fetch(url); const j = await r.json();
    if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.message || j.code);
    setRoute(j.routes[0]); return true;
  } catch(e){
    $('dStats').textContent = 'Не удалось построить маршрут';
    toast('Ошибка маршрута: ' + e.message, 5000); return false;
  }
}

function setRoute(r){
  const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i-1] + hav(coords[i-1], coords[i]));
  const steps = r.legs[0].steps;
  let k = 0;
  steps.forEach(s => {               // привязываем каждый манёвр к точке линии маршрута
    const ml = [s.maneuver.location[1], s.maneuver.location[0]];
    let best = k, bd = Infinity;
    for (let i = k; i < coords.length; i++){ const d = hav(coords[i], ml); if (d < bd){ bd = d; best = i; } if (d < 1) break; }
    s.at = cum[best]; k = best;
  });
  route = { coords, cum, steps, total: cum[cum.length-1] || 1, duration: r.duration, seg: 0, said: {} };
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [
    L.polyline(coords, { color:'#0b6e5f', weight:13, opacity:.85, interactive:false }).addTo(map),
    L.polyline(coords, { color:'#22c3a6', weight:8, interactive:false }).addTo(map)
  ];
}

function renderSteps(){
  const box = $('steps'); box.innerHTML = '';
  let prev = 0;
  route.steps.forEach((s, i) => {
    if (i === 0) return;
    const row = document.createElement('div'); row.className = 'st';
    row.innerHTML = '<div class="a">' + arrowOf(s) + '</div><div class="t">' + esc(textOf(s)) + '</div><div class="d">' + fmtDist(s.at - prev) + '</div>';
    prev = s.at; box.appendChild(row);
  });
}

/* ================= навигация ================= */
let offCount = 0, lastReroute = 0, rerouting = false;

function startNav(){
  if (!route) return;
  state = 'nav'; setFollow(true); route.seg = 0; route.said = {};
  $('banner').classList.remove('hidden'); $('speed').classList.remove('hidden');
  $('top').classList.add('hidden'); $('steps').classList.add('hidden'); $('go').classList.add('hidden'); $('demo').classList.add('hidden');
  requestWake(); speak('Поехали');
  if (pos){ updateNav(pos); map.setView(pos, 17); }
}

function stopNav(){
  stopSim();
  state = 'idle'; route = null; dest = null;
  routeLayers.forEach(l => map.removeLayer(l)); routeLayers = [];
  if (destMarker){ map.removeLayer(destMarker); destMarker = null; }
  ['banner', 'bottom', 'speed'].forEach(i => $(i).classList.add('hidden'));
  $('top').classList.remove('hidden');
  releaseWake(); setFollow(true); if (pos) map.setView(pos, 16);
}

function updateNav(p){
  const rt = route; if (!rt) return;
  const c = rt.coords;
  let bestD = Infinity, bestI = rt.seg, bestT = 0;
  const from = Math.max(0, rt.seg - 3), to = Math.min(c.length - 1, rt.seg + 300);
  for (let i = from; i < to; i++){ const r = segProj(p, c[i], c[i+1]); if (r.d < bestD){ bestD = r.d; bestI = i; bestT = r.t; } }
  if (bestD === Infinity){ bestD = hav(p, c[0]); bestI = 0; }
  const segLen = (rt.cum[bestI+1] ?? rt.cum[bestI]) - rt.cum[bestI];
  const progress = rt.cum[bestI] + bestT * segLen;

  // съехали с маршрута → перестраиваем
  if (bestD > 50){
    offCount++;
    if (offCount >= 3 && !rerouting && Date.now() - lastReroute > 10000) reroute();
  } else { offCount = 0; rt.seg = bestI; }

  const remain = Math.max(0, rt.total - progress);
  if (remain < 30 && bestD < 60){ arrive(); return; }

  let j = rt.steps.findIndex(s => s.at > progress + 5);
  if (j < 0) j = rt.steps.length - 1;
  const s = rt.steps[j], d = Math.max(0, s.at - progress);
  $('bArrow').textContent = arrowOf(s);
  $('bDist').textContent = fmtDist(d);
  $('bText').textContent = textOf(s);
  const tl = rt.duration * remain / rt.total;
  $('dName').textContent = dest.name;
  $('dStats').textContent = fmtDist(remain) + ' · ' + fmtTime(tl) + ' · прибытие ' + clock(tl);

  const said = rt.said[j] || (rt.said[j] = {});
  if (!said.far && d <= 400 && d > 150){ said.far = true; speak('Через ' + Math.round(d/50)*50 + ' метров ' + lc(textOf(s))); }
  if (!said.near && d <= 70){ said.near = said.far = true; speak(textOf(s)); }
}

async function reroute(){
  rerouting = true; lastReroute = Date.now(); offCount = 0;
  toast('Перестраиваю маршрут…'); speak('Перестраиваю маршрут');
  await buildRoute();
  rerouting = false;
}

function arrive(){
  speak('Вы прибыли'); toast('Вы прибыли: ' + (dest ? dest.name : ''), 5000); stopNav();
}

/* ================= экран не гаснет (для телефона) ================= */
let wake = null;
async function requestWake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch(e){} }
function releaseWake(){ try { if (wake) wake.release(); } catch(e){} wake = null; }

/* ================= демо-режим (?sim=1) ================= */
let simTimer = null;
function startSim(){
  if (!route) return;
  if (state !== 'nav') startNav();
  simRunning = true;
  const c = route.coords.slice(), v = 14; // ~50 км/ч
  let i = 0, f = 0;
  clearInterval(simTimer);
  simTimer = setInterval(() => {
    let left = v;
    while (left > 0 && i < c.length - 1){
      const L_ = hav(c[i], c[i+1]);
      if (L_ === 0){ i++; f = 0; continue; }
      const rest = L_ * (1 - f);
      if (left < rest){ f += left / L_; left = 0; } else { left -= rest; i++; f = 0; }
    }
    const cur = i >= c.length - 1 ? c[c.length-1] : [c[i][0] + (c[i+1][0]-c[i][0])*f, c[i][1] + (c[i+1][1]-c[i][1])*f];
    onPosition(cur[0], cur[1], 5, v, null);
    if (i >= c.length - 1) stopSim();
  }, 1000);
}
function stopSim(){ clearInterval(simTimer); simTimer = null; simRunning = false; }

/* ================= события ================= */
$('qBtn').onclick = search;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('q').addEventListener('focus', () => { if (!$('q').value.trim()) showRecent(); });
$('q').addEventListener('input', () => { if (!$('q').value.trim()) showRecent(); });
$('go').onclick = startNav;
$('stop').onclick = stopNav;
$('demo').onclick = startSim;
$('zin').onclick = () => map.zoomIn();
$('zout').onclick = () => map.zoomOut();
$('center').onclick = () => { setFollow(true); if (pos) map.setView(pos, state === 'nav' ? 17 : 16); else toast('Жду сигнал GPS…'); };
$('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); };
$('voice').onclick = () => { voiceOn = !voiceOn; applyVoice(); if (voiceOn) speak('Голос включён'); };
map.on('dragstart', () => setFollow(false));

map.on('click', e => {
  if (state === 'nav') return;
  hideResults(); $('q').blur();
  const it = { name:'Точка на карте', addr: e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5), lat:e.latlng.lat, lng:e.latlng.lng };
  const b = document.createElement('button');
  b.className = 'btn green'; b.textContent = 'Поехать сюда';
  b.onclick = () => { map.closePopup(); setDest(it); };
  L.popup({ closeButton:false }).setLatLng(e.latlng).setContent(b).openOn(map);
});

applyTheme(); applyVoice(); startGeo();
if (SIM) toast('Демо-режим: выберите место и нажмите «Демо»', 4000);
